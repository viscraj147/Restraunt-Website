<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Professional Registration Form</title>

<link rel="stylesheet" href="style4.css">



</head>

<body>
<header>
        <div class="logo">🔥 Kitchen Ka Kand</div>

        <nav>
            <a href="ind.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="chef.html">Chef</a>
            <a href="login.html">Login</a>
            <a href="index3.html">Feedback</a>
    </header>

<div class="page-container">

    <div class="registration-card">

        <!-- Left Section -->
        <div class="form-image">
            <div class="overlay">
                <h2>Join Our Community</h2>
                <p>
                    Create your account and start your journey
                    with us today.
                </p>
            </div>
        </div>

        <!-- Right Section -->
        <div class="form-section">

            <div class="form-header">
                <h1>Create Account</h1>
                <p>Fill in the details below to register</p>
            </div>

            <form id="registrationForm" novalidate>

                <!-- Full Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                    >

                    <small id="nameError" class="error"></small>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                    >

                    <small id="emailError" class="error"></small>
                </div>

                <!-- Mobile -->
                <div class="form-group">
                    <label for="mobile">Mobile Number</label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter 10-digit mobile number"
                        maxlength="10"
                    >

                    <small id="mobileError" class="error"></small>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a strong password"
                    >

                    <div class="password-strength">
                        <div
                            id="strengthBar"
                            class="strength-bar"
                        ></div>
                    </div>

                    <small
                        id="strengthText"
                        class="strength-text"
                    ></small>

                    <small
                        id="passwordError"
                        class="error"
                    ></small>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                    >

                    <small
                        id="confirmPasswordError"
                        class="error"
                    ></small>
                </div>

                <div class="form-group">
                    <label for="text">Comments</label>

                    <input
                        type="tel"
                        id="tetx"
                        placeholder="Enter comment"
                        maxlength="500"
                    >

                    <small id="commenterror" class="error"></small>
                </div>

                <!-- Terms -->
                <div class="terms">
                    <input
                        type="checkbox"
                        id="terms"
                    >

                    <label for="terms">
                        I agree to the
                        <a href="#">Terms & Conditions</a>
                        and
                        <a href="#">Privacy Policy</a>.
                    </label>
                </div>
                

                <small
                    id="termsError"
                    class="error terms-error"
                ></small>

                <!-- Submit -->
                <button
                    type="submit"
                    class="submit-btn"
                >
                    Create Account
                </button>

                <!-- Success Message -->
                <div
                    id="successMessage"
                    class="success-message"
                >
                    Registration successful!
                </div>

            </form>

        </div>

    </div>

</div>

<script src="script.js"></script>


</body>
</html>
